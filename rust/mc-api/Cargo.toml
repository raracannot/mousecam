[package]
name = "mc-api"
version = "0.1.0"
edition = "2021"

[dependencies]
mc-engine = { path = "../mc-engine" }
serde = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
base64 = "0.22"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_DataExchange", "Win32_System_Memory"] }
